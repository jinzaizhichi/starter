name: CI/CD 流程

on:
  push: # 推送到 dev 或 release 分支时触发
    branches: 
      - dev
      - release
  pull_request: # PR 合并到 release 分支时触发 (即 dev -> release 的合并)
    branches: 
      - release

jobs:
  build_and_test: 
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 确保版本匹配你的项目

      - name: 3. 安装依赖
        run: npm install

      - name: 4. 运行测试
        run: npm test # 确保您的 package.json 中有这个脚本

      # ----------------------------------------------------
      # 5. 邮件通知步骤 - 已定制您的邮箱和仓库信息
      # ----------------------------------------------------
      
      - name: 5.1. 成功时发送通知 (分支测试/合并成功)
        if: success()
        uses: dawidd6/action-send-mail@v3 
        with:
          server_address: smtp.gmail.com 
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }} 
          password: ${{ secrets.EMAIL_PASSWORD }} 
          subject: "✅ CI/CD 成功: ${{ github.ref_name }}"
          to: jinzaizhichi9888@gmail.com # 您的邮箱
          from: GitHub Actions <noreply@github.com>
          body: |
            🎉 构建成功! 代码已通过测试。
            仓库: jinzaizhichi/starter
            分支: ${{ github.head_ref || github.ref_name }}
            详情链接: https://github.com/jinzaizhichi/starter/actions/runs/${{ github.run_id }}

      - name: 5.2. 失败时发送通知 (构建失败)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com 
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ CI/CD 失败: ${{ github.ref_name }}"
          to: jinzaizhichi9888@gmail.com # 您的邮箱
          from: GitHub Actions <noreply@github.com>
          body: |
            🚨 构建失败，请检查日志!
            仓库: jinzaizhichi/starter
            分支: ${{ github.head_name || github.ref_name }}
            详情链接: https://github.com/jinzaizhichi/starter/actions/runs/${{ github.run_id }}
