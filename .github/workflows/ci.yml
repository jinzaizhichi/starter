name: CI/CD 流程

on:
  push:
    branches: 
      - dev
      - release
  pull_request:
    branches: 
      - release    # dev → release 的 PR 也会触发

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 建议加上，防止浅克隆有时会导致问题

      - name: 2. 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'    # 加上这一行，第二次构建会快 5～10 倍

      - name: 3. 安装依赖
        # run: npm ci           # 强烈建议改成 npm ci，比 npm install 更稳定、更快
        run: npm install 

      - name: 4. 运行测试
        run: npm test

      # ------------------ 成功邮件 ------------------
      - name: 成功发送邮件通知
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ CI/CD 成功 - ${{ github.ref_name }}"
          to: jinzaizhichi9888@gmail.com
          from: GitHub Actions <noreply@github.com>
          body: |
            构建成功！代码已通过所有测试
            
            仓库：${{ github.repository }}
            分支：${{ github.head_ref || github.ref_name }}
            提交：${{ github.sha }}
            详情：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ------------------ 失败邮件 ------------------
      - name: 失败发送邮件通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ CI/CD 失败 - ${{ github.ref_name }}"
          to: jinzaizhichi9888@gmail.com
          from: GitHub Actions <noreply@github.com>
          body: |
            构建失败了！请尽快查看日志
            
            仓库：${{ github.repository }}
            分支：${{ github.head_ref || github.ref_name }}
            提交：${{ github.sha }}
            日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
