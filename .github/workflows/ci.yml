name: Configuration Check (CI)
# ...

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 👇 备用方案：使用 rhysd/action-setup-vim，并提供明确的标签
      - name: Setup Neovim (rhysd/action-setup-vim)
        uses: rhysd/action-setup-vim@v1
        with:
          # IMPORTANT: 必须是明确的 Neovim Git 标签
          version: 'v0.9.5' # 或者 'v0.10.0' 等具体版本
          token: ${{ secrets.GITHUB_TOKEN }} 
          
      - name: Show Neovim Version
        run: nvim --version | head -n 1
      
      - name: Install Lazy.nvim and Plugins
        run: |
          nvim --headless '+Lazy sync' '+qa!'
        env:
          HOME: /home/runner/
        shell: bash
