name: CI Pipeline  # 工作流名称

on:
  push:  # 推送事件触发
    branches: [dev, release]  # 支持 dev 和 release 分支
  pull_request:  # PR 事件触发（合并到 release 时）
    branches: [release]

jobs:
  build:  # 作业 ID
    runs-on: ubuntu-latest  # 运行环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 检出代码

      - name: Run tests  # 示例：运行测试（替换成你的命令）
        run: |
          echo "Running tests on branch: ${{ github.ref_name }}"  # 输出当前分支名
          # 这里加你的测试命令，如 npm test 或 go test

      - name: Send mail notification  # 邮件通知步骤（成功时发送）
        if: success()  # 只在成功时运行
        uses: dawidd6/action-send-mail@v3  # 邮件 Action
        with:
          server_address: smtp.gmail.com  # SMTP 服务器（替换成你的，如 Outlook）
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}  # GitHub Secrets 中存用户名
          password: ${{ secrets.EMAIL_PASSWORD }}  # GitHub Secrets 中存密码（App Password）
          subject: "CI Success on ${{ github.ref_name }}"  # 邮件主题，包含分支名
          to: your-email@example.com  # 收件人
          from: GitHub Actions <noreply@github.com>
          body: |
            Build succeeded on upstream branch: ${{ github.head_ref || github.ref_name }}  # 如果是 PR，用 head_ref（上游分支）；否则用当前分支
            Details: https://github.com/your-username/your-repo/actions/runs/${{ github.run_id }}
